# Every variable below uses the required form (NAME:?message): if it is empty or unset in .env,
# docker compose stops before anything starts and names the variable (never its value).
# The two exceptions are the optional NCBI_API_KEY and NCBI_EMAIL (app only), which use
# NAME:- so they are empty when unset; the app runs without them.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - traefik.enable=false
    networks:
      - internal

  app:
    image: ${APP_IMAGE:?set APP_IMAGE in .env}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      OWNER_EMAIL: ${OWNER_EMAIL:?set OWNER_EMAIL in .env}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      NCBI_EMAIL: ${NCBI_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    labels:
      - traefik.enable=false
    networks:
      - internal

  gate:
    # Pinned tag. Must stay at or above v7.15.5: CVE-2026-40575 (fixed in 7.15.2) and
    # CVE-2026-76835 (the same bypass under the default trusted-proxy set, 7.15.2 to 7.15.4).
    # The tag was not checked against quay.io from the build machine.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    restart: unless-stopped
    # No skip-auth rule on purpose: every path needs sign-in. /healthz is only called by the
    # app container's own healthcheck inside the internal network.
    command:
      - --provider=google
      - --upstream=http://app:8000
      - --http-address=0.0.0.0:4180
      - --authenticated-emails-file=/etc/gate/emails.txt
      - --pass-user-headers=true
      - --cookie-secure=true
      # Traefik terminates HTTPS and sets X-Forwarded-Proto/Host/For. --reverse-proxy makes
      # the gate read them, so the redirects it builds use https and the public host, and its
      # logs show the real client address. The gate publishes no port, but any container on
      # the shared Traefik network (not only Traefik) can reach it, so the gate trusts these
      # headers only from that network's subnet (infra/README.md step 2c). Other containers
      # on that network can still forge them; that is harmless while there is no skip-auth
      # or trusted-ip rule for a forged header to match.
      - --reverse-proxy=true
      - --trusted-proxy-ip=${TRAEFIK_SUBNET:?set TRAEFIK_SUBNET in .env}
      - --redirect-url=https://${APP_HOST:?set APP_HOST in .env}/oauth2/callback
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?set OAUTH2_PROXY_CLIENT_ID in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?set OAUTH2_PROXY_CLIENT_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set OAUTH2_PROXY_COOKIE_SECRET in .env}
    volumes:
      - ./gate/emails.txt:/etc/gate/emails.txt:ro
    depends_on:
      app:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env}
      - traefik.http.routers.pubmedgemini.rule=Host(`${APP_HOST:?set APP_HOST in .env}`)
      - traefik.http.routers.pubmedgemini.entrypoints=${TRAEFIK_ENTRYPOINT:?set TRAEFIK_ENTRYPOINT in .env}
      - traefik.http.routers.pubmedgemini.tls.certresolver=${TRAEFIK_CERTRESOLVER:?set TRAEFIK_CERTRESOLVER in .env}
      - traefik.http.routers.pubmedgemini.service=pubmedgemini
      - traefik.http.services.pubmedgemini.loadbalancer.server.port=4180
    networks:
      - internal
      - traefik

volumes:
  pgdata:

networks:
  internal:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env}
