services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DATABASE_URL: ${DATABASE_URL}
      OWNER_EMAIL: ${OWNER_EMAIL}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - internal

  gate:
    # Pinned tag. Not checked against the registry from the build machine.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    command:
      - --provider=google
      - --upstream=http://app:8000
      - --http-address=0.0.0.0:4180
      - --authenticated-emails-file=/etc/gate/emails.txt
      - --pass-user-headers=true
      - --skip-auth-route=GET=^/healthz$
      - --cookie-secure=true
      - --reverse-proxy=true
      - --redirect-url=https://${APP_HOST}/oauth2/callback
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
    volumes:
      - ./gate/emails.txt:/etc/gate/emails.txt:ro
    depends_on:
      app:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.pubmedgemini.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.pubmedgemini.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.pubmedgemini.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.routers.pubmedgemini.service=pubmedgemini
      - traefik.http.services.pubmedgemini.loadbalancer.server.port=4180
    networks:
      - internal
      - traefik

volumes:
  pgdata:

networks:
  internal:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
