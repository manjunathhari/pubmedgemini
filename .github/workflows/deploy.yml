name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the image name (registry names must be lower case)
        id: name
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH (host key checking stays on)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy compose.yaml and backup.sh to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          opts=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" -o IdentitiesOnly=yes)
          scp "${opts[@]}" compose.yaml "${VPS_USER}@${VPS_HOST}:/opt/pubmedgemini/compose.yaml"
          scp "${opts[@]}" infra/backup.sh "${VPS_USER}@${VPS_HOST}:/opt/pubmedgemini/backup.sh"
      - name: Pull, restart, wait for healthy, roll back on failure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          opts=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" -o IdentitiesOnly=yes)
          ssh "${opts[@]}" "${VPS_USER}@${VPS_HOST}" bash -s -- "$IMAGE" <<'REMOTE'
          set -u
          new_image="$1"
          cd /opt/pubmedgemini
          chmod +x backup.sh
          previous="$(grep '^APP_IMAGE=' .env || true)"
          sed -i '/^APP_IMAGE=/d' .env
          echo "APP_IMAGE=${new_image}" >> .env
          docker compose pull app
          docker compose up -d
          for _ in $(seq 1 24); do
            if docker compose ps --format json app | grep -q '"Health":"healthy"'; then
              echo "app is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "app did not become healthy within 120 s; rolling back" >&2
          if [ -n "$previous" ]; then
            sed -i '/^APP_IMAGE=/d' .env
            echo "$previous" >> .env
            docker compose up -d
          else
            echo "no previous image recorded; nothing to roll back to" >&2
          fi
          exit 1
          REMOTE
      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
