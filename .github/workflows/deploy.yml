name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the image name (registry names must be lower case)
        id: name
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH (host key checking stays on)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          # Fails the job here, before any copy, if the key is not a readable private key.
          # Prints only the key's public fingerprint, to compare with the one printed on the VPS.
          bash infra/write_deploy_key.sh "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' | sed -E 's/[[:blank:]]+$//' > ~/.ssh/known_hosts
      - name: Copy the release files to the VPS (each goes in as <name>.new; nothing live is overwritten)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          opts=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" -o IdentitiesOnly=yes)
          dest="${VPS_USER}@${VPS_HOST}:/opt/pubmedgemini"
          scp "${opts[@]}" compose.yaml "${dest}/compose.yaml.new"
          scp "${opts[@]}" infra/deploy.sh "${dest}/deploy.sh.new"
          scp "${opts[@]}" infra/backup.sh "${dest}/backup.sh.new"
      - name: Deploy (infra/deploy.sh rolls back and fails if the new version is not up)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          opts=(-i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" -o IdentitiesOnly=yes)
          # Built here on purpose: the image name is known on the runner, not on the VPS.
          # deploy.sh.new is moved into place (an atomic rename) before it runs, so no
          # running copy is ever overwritten. deploy.sh moves backup.sh.new into place only
          # after a healthy deploy, and removes it on rollback, so cron never reads a
          # half-copied backup.sh.
          dir=/opt/pubmedgemini
          remote="chmod 700 $dir/deploy.sh.new $dir/backup.sh.new"
          remote+=" && mv -f $dir/deploy.sh.new $dir/deploy.sh"
          remote+=" && $dir/deploy.sh $(printf '%q' "$IMAGE")"
          # shellcheck disable=SC2029 # client-side expansion is intended (see above)
          ssh "${opts[@]}" "${VPS_USER}@${VPS_HOST}" "$remote"
      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
