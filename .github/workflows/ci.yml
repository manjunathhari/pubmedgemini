name: ci

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Install (runtime from the hashed lock, then the dev tools)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (a skipped database test is a failure)
        run: |
          set -o pipefail
          pytest -v -rs | tee pytest.log
          if grep -q "TEST_DATABASE_URL" pytest.log; then
            echo "A database test was skipped. Failing." >&2
            exit 1
          fi
          if grep -qiE "[0-9]+ skipped" pytest.log; then
            echo "Some tests were skipped. Failing." >&2
            exit 1
          fi
