<svg xmlns="http://www.w3.org/2000/svg" class="scene search" width="320" height="190" viewBox="0 0 320 190"><style>.scene g,.scene line{transform-box:view-box}
.scene .w{stroke:#9AA7B4;stroke-width:2;stroke-linecap:round}
.search .bk{opacity:0;animation:7s cubic-bezier(.2,.7,.3,1) infinite}
.search .k1{animation-name:f1}.search .k2{animation-name:f2}.search .k3{animation-name:f3}.search .k4{animation-name:f4}.search .k5{animation-name:f5}
@keyframes f1{0%,2%{opacity:0;transform:translate(160px,-120px) rotate(-40deg)}14%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes f2{0%,18%{opacity:0;transform:translate(160px,-120px) rotate(-40deg)}30%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes f3{0%,34%{opacity:0;transform:translate(160px,-120px) rotate(-40deg)}46%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes f4{0%,50%{opacity:0;transform:translate(160px,-120px) rotate(-40deg)}62%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes f5{0%,66%{opacity:0;transform:translate(160px,-120px) rotate(-40deg)}78%,90%{opacity:1;transform:none}100%{opacity:0}}
.search .head{transform-origin:120px 104px;animation:look 7s ease-in-out infinite}
@keyframes look{0%,8%{transform:none}18%,82%{transform:rotate(6deg)}92%,100%{transform:none}}
.write .head{transform-origin:120px 104px;transform:rotate(7deg) translateY(3px)}
.write .hand{animation:hand 1.4s ease-in-out infinite alternate}
@keyframes hand{from{transform:translateX(-34px)}to{transform:none}}
.write .w{stroke-dasharray:50;stroke-dashoffset:50;animation:ink 4.2s linear infinite}
.write .w2{animation-delay:1.4s}.write .w3{animation-delay:2.8s}
@keyframes ink{0%{stroke-dashoffset:50}30%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:.3}}
.done .report{animation:up 1.4s cubic-bezier(.2,.7,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(70px) scale(.6)}to{opacity:1;transform:none}}
.done .okg{transform-origin:242px 84px;animation:pop .5s 1.2s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.scene *{animation:none!important;opacity:1}.write .w{stroke-dashoffset:0}}
</style><defs>
