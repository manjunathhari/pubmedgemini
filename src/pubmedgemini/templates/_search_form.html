<form method="post" action="/search">
<p><label for="q">Search PubMed and Europe PMC</label></p>
<p><input id="q" name="q" type="text" maxlength="1000" required{% if query %} value="{{ query }}"{% endif %}>
<button type="submit">Search</button></p>
</form>
<p class="sai-runs">All searches run on regular PubMed and Europe PMC.</p>
<p class="sai-note">What you type is sent to PubMed and Europe PMC as the search. Do not type anything that identifies a patient.</p>
