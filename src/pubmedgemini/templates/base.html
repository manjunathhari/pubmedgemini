<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PubMed Ai</title>
{% block head %}{% endblock %}
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="site-header"><div class="site-header-inner">
<div class="tile" aria-hidden="true">SAi</div>
<div><div class="site-name">PubMed Ai</div><div class="site-note">Educational tool only</div></div>
</div>
{% if nav is defined %}
<nav aria-label="Main">
<a href="/"{% if nav == "ask" %} class="current" aria-current="page"{% endif %}>Ask</a>
<a href="/library"{% if nav == "library" %} class="current" aria-current="page"{% endif %}>Library</a>
<a href="/activity"{% if nav == "activity" %} class="current" aria-current="page"{% endif %}>Activity</a>
</nav>
{% endif %}
</header>
<main{% block main_class %}{% endblock %}>
{% block content %}{% endblock %}
</main>
</body>
</html>
