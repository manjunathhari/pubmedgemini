<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<style>
@font-face{font-family:"Hanken Grotesk";src:url(@@FONT_HANKEN@@) format("woff2");font-weight:100 900;font-style:normal}
@font-face{font-family:"Source Serif 4";src:url(@@FONT_SERIF@@) format("woff2");font-weight:200 900;font-style:normal}
:root{--page:#f7f4ec;--card:#ffffff;--border:#e4ded0;--text:#101a24;--muted:#5b6773;--accent:#1f6bd0;--note:#e3edf8;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--page:#101a24;--card:#16222e;--border:#22303e;--text:#eef2f6;--muted:#93a0ad;--accent:#5aa0ee;--note:#17283b}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:17px}
.screen{min-height:100vh;display:flex;flex-direction:column;padding:14px 20px 28px}
.top{display:flex;align-items:center;gap:10px;min-height:48px}
.badge{width:34px;height:34px;border-radius:50%;background:var(--text);color:var(--page);display:grid;place-items:center;font-size:13px;font-weight:500}
.badge span{font-size:1.18em}
.wm{font-size:19px;font-weight:300;letter-spacing:.08em}.wm i{font-style:normal;letter-spacing:-.01em;margin-left:.02em}
.mid{flex:1;display:grid;place-items:center}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px 22px;display:grid;gap:14px}
.lab{margin:0;font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:11.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font-weight:300;font-size:35px;line-height:1.07;letter-spacing:-.025em}
p{margin:0;font-family:"Source Serif 4",Georgia,serif;line-height:1.45}
.sub{color:var(--muted)}
.small{font-size:15px;text-align:center}
form{margin:0}
.gbtn{display:flex;justify-content:center;width:100%;margin:0;padding:0;border:0;background:none;cursor:pointer}
.gbtn img{display:block;width:234px;height:52px}
.gbtn:focus-visible img{outline:2px solid var(--accent);outline-offset:3px;border-radius:26px}
.ghost{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:26px;border:1px solid var(--border);color:var(--text);font-weight:500;text-decoration:none}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--note);color:var(--muted);border-radius:16px;padding:12px 14px;font-family:"Source Serif 4",Georgia,serif;font-size:14.5px;line-height:1.45}
.note svg{flex:none;width:16px;height:16px;margin-top:3px;opacity:.7}
.ref{font-size:13px;color:var(--muted)}
.foot{font-family:"Hanken Grotesk",system-ui,sans-serif;text-align:center;color:var(--muted);font-size:13.5px}
</style>
